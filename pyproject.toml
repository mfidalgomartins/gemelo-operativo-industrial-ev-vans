[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemelo-operativo-ev"
version = "1.0.2"
description = "Gemelo operativo para la transición de fabricación de vans EV"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Miguel Fidalgo Martins" },
]
keywords = [
    "analitica",
    "gemelo-digital",
    "duckdb",
    "vehiculos-electricos",
    "manufactura",
    "investigacion-operativa",
    "cadena-suministro",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "duckdb>=1.1.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "pillow>=12.2.0,<13.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.urls]
Panel = "https://mfidalgomartins.github.io/gemelo-operativo-industrial-ev-vans/"
Repositorio = "https://github.com/mfidalgomartins/gemelo-operativo-industrial-ev-vans"

[project.optional-dependencies]
dev = [
    "build>=1.2.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pygments>=2.20.0,<3.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.15.0,<1.0.0",
]
security = [
    "bandit[toml]>=1.8.0,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "pygments>=2.20.0,<3.0.0",
]

[project.scripts]
generate-data = "generate_synthetic_data:main"

[tool.setuptools]
packages = ["src", "src.synthetic_data_gen"]
py-modules = ["generate_synthetic_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: tests de canalización completa que escriben en el directorio data; ejecutar con pytest -m integration",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/synthetic_data_gen/config.py" = ["I001"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
# La capa DuckDB construye SQL con identificadores internos validados por whitelist.
# Los valores externos siguen parametrizados; B608 genera falsos positivos en este proyecto.
skips = ["B608"]
exclude_dirs = [
    ".venv",
    "build",
    "data",
    "dist",
    "outputs",
    "tests",
]
