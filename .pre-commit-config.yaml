# Ejecutar `pre-commit install` una vez; los hooks corren en cada commit.
# Refleja la puerta de calidad de la CI para detectar problemas antes del push.

# Artefactos generados (corte de datos versionado, gráficos, informe, panel)
# quedan excluidos de los hooks de normalización de texto; los produce la canalización.
exclude: '^(data/|outputs/|dist/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Permite el corte de datos versionado (el mart más grande, ~20 MB)
        # y bloquea el DuckDB reconstruible de 34 MB y otros binarios excesivos.
        args: ["--maxkb=25600"]
