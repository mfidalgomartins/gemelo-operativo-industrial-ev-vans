name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: calidad / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar proyecto y herramientas dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,service]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Comprobar formato Ruff
        run: python -m ruff format --check .

      - name: Pruebas unitarias con cobertura
        run: python -m pytest -q --cov=gemelo_operativo_ev --cov-report=term-missing --cov-report=xml

  package:
    name: paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Construir distribuciones source y wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m build

      - name: Probar wheel en entorno aislado
        run: |
          python -m venv /tmp/ev-twin-package-smoke
          /tmp/ev-twin-package-smoke/bin/python -m pip install --upgrade pip
          /tmp/ev-twin-package-smoke/bin/python -m pip install dist/*.whl
          /tmp/ev-twin-package-smoke/bin/ev-twin --help
          /tmp/ev-twin-package-smoke/bin/python - <<'PY'
          from importlib.resources import files
          import gemelo_operativo_ev

          package = files("gemelo_operativo_ev")
          assert len(list(package.joinpath("sql", "ev_factory").iterdir())) == 11
          assert package.joinpath("dashboard", "dashboard.html").is_file()
          assert gemelo_operativo_ev.__version__ == "2.0.0"
          PY

      - name: Publicar distribuciones como artefacto CI
        uses: actions/upload-artifact@v7
        with:
          name: gemelo-operativo-ev-dist
          path: dist/*
          if-no-files-found: error

  integration:
    name: integración
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar proyecto y herramientas dev
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,service]"

      - name: Generar datos sintéticos
        run: generate-data --seed 20260328 --start-date 2025-01-01 --months 12

      - name: Ejecutar canalización analítica
        run: python -m gemelo_operativo_ev.run_pipeline

      - name: Construir paquete de gráficos
        run: ev-twin charts

      - name: Construir informe
        run: ev-twin report

      - name: Evaluar puerta de publicación
        run: python -m gemelo_operativo_ev.ev_release_gate

      - name: Suite completa con puerta de cobertura combinada
        run: >-
          python -m pytest -q
          -m "integration or not integration"
          --cov=gemelo_operativo_ev --cov-report=term-missing
          --cov-fail-under=85

  security:
    name: seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar proyecto y herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security,service]"

      - name: Análisis estático de seguridad Bandit
        run: python -m bandit -q -r src -c pyproject.toml

      - name: Auditoría de vulnerabilidades de dependencias
        run: python -m pip_audit --strict .
