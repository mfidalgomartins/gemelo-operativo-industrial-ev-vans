name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: generate-data --seed 20260328 --start-date 2025-01-01 --months 12
      - run: python -m src.run_pipeline
      - run: python scripts/generate_chart_pack.py
      - run: python scripts/generate_report.py
      - run: python -m src.ev_release_gate
      - run: pytest -q -m integration
